spring.application.name=defect-registration-system

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.liquibase.contexts=local
mybatis.type-handlers-package=com.sourcery.defect_registration_system.config.mybatis
mybatis.configuration.map-underscore-to-camel-case=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,email,profile

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

frontend.url=${FRONTEND_URL}

logging.file.path=log
logging.include-application-name=false
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.com.sourcery.defect_registration_system.issue.service=DEBUG

springdoc.swagger-ui.csrf.enabled=true
