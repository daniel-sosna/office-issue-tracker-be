databaseChangeLog:
  - changeSet:
      id: 004
      author: auste
      changes:
        - dropColumn:
            tableName: issue
            columnName: office
        - addColumn:
            tableName: issue
            columns:
              - column:
                  name: office_id
                  type: UUID
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: issue
            baseColumnNames: office_id
            referencedTableName: office
            referencedColumnNames: id
            constraintName: fk_issue_office