databaseChangeLog:
  - changeSet:
      id: 001
      author: auste
      changes:
        - createTable:
            tableName: issue
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: summary
                  type: VARCHAR(200)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: office
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: 'OPEN'
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: date_created
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: date_modified
                  type: TIMESTAMPTZ
